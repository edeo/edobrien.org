<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ed O'Brien</title>
<meta name="description" content="Ed O'Brien">
<style>
  :root { --fg: #1a1a1a; --muted: #666; --bg: #fafaf8; --link: #0066cc; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #eee; --muted: #999; --bg: #141414; --link: #6aa9ff; }
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
    max-width: 40rem;
    margin: 0 auto;
    padding: 4rem 1.25rem;
    line-height: 1.6;
  }
  h1 { font-size: 2rem; margin: 0 0 0.25rem; }
  .tagline { color: var(--muted); margin: 0 0 2rem; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ul { list-style: none; padding: 0; display: flex; gap: 1.25rem; flex-wrap: wrap; }
</style>
</head>
<body>
  <h1>Ed O'Brien</h1>
  <p class="tagline">Welcome to my corner of the web.</p>
  <ul>
    <li><a href="https://www.linkedin.com/in/edbobrien/">LinkedIn</a></li>
    <li><a href="https://edeo.wordpress.com/">Blog</a></li>
    <li><a href="https://github.com/edeo">GitHub</a></li>
  </ul>
</body>
</html>
